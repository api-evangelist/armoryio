name: Armory.io
description: 'Armory.io was an enterprise continuous delivery and continuous deployment company built
  around the open-source Spinnaker project. Its products included Armory Continuous Deployment
  Self-Hosted and Managed (an enterprise Spinnaker distribution), Armory Continuous Deployment-as-a-Service
  (CDaaS) with a declarative GitOps deployment experience, and the Armory Scale Agent for Spinnaker and
  Kubernetes. Armory was backed by Insight Partners and was later acquired by Harness; the armory.io
  website now 301-redirects to harness.io and the CDaaS cloud service, developer portal, and status page
  are decommissioned, while the documentation site (docs.armory.io) and the Apache-2.0 GitHub organization
  (github.com/armory) remain live.'
